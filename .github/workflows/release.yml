name: computer
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          TAG=${GITHUB_REF_NAME}
          docker build -f deploy/Dockerfile.supervisor -t ghcr.io/tomlis20/hermes-computer-supervisor:$TAG .
          docker build -f image/Dockerfile -t ghcr.io/tomlis20/hermes-computer:$TAG .
          docker push ghcr.io/tomlis20/hermes-computer-supervisor:$TAG
          docker push ghcr.io/tomlis20/hermes-computer:$TAG
